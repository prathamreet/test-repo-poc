name: PR CI/CD & DevOps Agent Triage

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------
  # JOB 1: Fast Checks (Lint, Formatting, Unit Tests)
  # If this fails, the workflow STOPS HERE. Agent will NOT trigger ($0 cost).
  # -----------------------------------------------------------------
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Linter & Unit Tests
        id: run_tests
        run: |
          npm run lint
          npm test

  # -----------------------------------------------------------------
  # JOB 2: Cloud Validation (Terraform Plan, CDK Diff, Deploy Preview)
  # Runs ONLY if Job 1 (lint and unit tests) passed!
  # -----------------------------------------------------------------
  cloud-validation:
    runs-on: ubuntu-latest
    needs: [lint-and-unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Cloud & Infrastructure
        id: cloud_check
        run: |
          npm run validate-cloud
          # ---------------------------------------------------------
          # POC TESTING:
          # On PR test branches, change the line above to:
          # npm run simulate-cloud-fail
          # ---------------------------------------------------------

  # -----------------------------------------------------------------
  # JOB 3: AWS DevOps Agent Triage
  # Triggers ONLY if lint/tests SUCCEEDED, but cloud-validation FAILED!
  # -----------------------------------------------------------------
  devops-agent-triage:
    runs-on: ubuntu-latest
    needs: [lint-and-unit-tests, cloud-validation]
    if: |
      always() &&
      needs.lint-and-unit-tests.result == 'success' &&
      needs.cloud-validation.result == 'failure'
    steps:
      - name: Dispatch Signed Webhook to AWS DevOps Agent
        env:
          DEVOPS_AGENT_WEBHOOK_URL: ${{ secrets.DEVOPS_AGENT_WEBHOOK_URL }}
          DEVOPS_AGENT_WEBHOOK_SECRET: ${{ secrets.DEVOPS_AGENT_WEBHOOK_SECRET }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVICE_NAME: ${{ github.event.repository.name }}
        run: |
          python3 - << 'EOF'
          import os, json, hmac, hashlib, base64, urllib.request, datetime

          url = os.environ.get('DEVOPS_AGENT_WEBHOOK_URL', '').strip()
          secret = os.environ.get('DEVOPS_AGENT_WEBHOOK_SECRET', '').strip()

          if not url or not secret:
              print("Error: DEVOPS_AGENT_WEBHOOK_URL or DEVOPS_AGENT_WEBHOOK_SECRET is empty.")
              exit(1)

          timestamp = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.000Z')
          pr_num = os.environ.get('PR_NUM') or 'manual'
          pr_title = os.environ.get('PR_TITLE') or 'Manual Trigger'
          commit_sha = os.environ.get('COMMIT_SHA') or os.environ.get('GITHUB_SHA', '')

          payload_dict = {
              "eventType": "incident",
              "incidentId": f"gh-pr-{pr_num}-{os.environ['GITHUB_RUN_ID']}",
              "action": "created",
              "priority": "HIGH",
              "title": f"Cloud Validation Failed on PR #{pr_num}: {pr_title}",
              "description": f"Cloud infrastructure validation failed on PR #{pr_num}. Investigate AWS telemetry, CloudWatch logs, and PR commit {commit_sha}. Workflow: {os.environ['RUN_URL']}",
              "timestamp": timestamp,
              "service": os.environ.get('SERVICE_NAME', 'test-repo-poc'),
              "data": {
                  "metadata": {
                      "repository": os.environ['GITHUB_REPOSITORY'],
                      "pr_number": pr_num,
                      "commit": commit_sha,
                      "run_id": os.environ['GITHUB_RUN_ID']
                  }
              }
          }

          payload = json.dumps(payload_dict)
          sign_input = f"{timestamp}:{payload}"
          signature = base64.b64encode(hmac.new(secret.encode('utf-8'), sign_input.encode('utf-8'), hashlib.sha256).digest()).decode('utf-8')

          headers = {
              'Content-Type': 'application/json',
              'x-amzn-event-timestamp': timestamp,
              'x-amzn-event-signature': signature
          }

          print(f"Sending HMAC-signed payload to AWS DevOps Agent for PR #{pr_num}...")
          req = urllib.request.Request(url, data=payload.encode('utf-8'), headers=headers, method='POST')
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Success! AWS DevOps Agent Webhook Accepted: HTTP {resp.status}")
                  response_body = resp.read().decode('utf-8')
                  print(f"Response: {response_body}")
          except urllib.error.HTTPError as e:
              err_text = e.read().decode('utf-8')
              print(f"HTTP Error {e.code}: {err_text}")
              exit(1)
          EOF
