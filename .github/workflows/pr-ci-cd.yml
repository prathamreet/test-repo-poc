name: PR CI/CD & DevOps Agent Triage

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  # -----------------------------------------------------------------
  # JOB 1: Fast Checks (Lint, Formatting, Unit Tests)
  # If this fails, the workflow STOPS HERE. Agent will NOT trigger ($0 cost).
  # -----------------------------------------------------------------
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Linter & Unit Tests
        id: run_tests
        run: |
          npm run lint
          npm test

  # -----------------------------------------------------------------
  # JOB 2: Cloud Validation (Terraform Plan, CDK Diff, Deploy Preview)
  # Runs ONLY if Job 1 (lint and unit tests) passed!
  # -----------------------------------------------------------------
  cloud-validation:
    runs-on: ubuntu-latest
    needs: [lint-and-unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Cloud & Infrastructure
        id: cloud_check
        run: |
          npm run simulate-cloud-fail
          # ---------------------------------------------------------
          # POC TESTING:
          # To simulate a cloud failure and trigger the agent,
          # change the line above to: npm run simulate-cloud-fail
          # ---------------------------------------------------------

  # -----------------------------------------------------------------
  # JOB 3: AWS DevOps Agent Triage
  # Triggers ONLY if lint/tests SUCCEEDED, but cloud-validation FAILED!
  # -----------------------------------------------------------------
  devops-agent-triage:
    runs-on: ubuntu-latest
    needs: [lint-and-unit-tests, cloud-validation]
    if: |
      always() &&
      needs.lint-and-unit-tests.result == 'success' &&
      needs.cloud-validation.result == 'failure'
    steps:
      - name: Dispatch Webhook to AWS DevOps Agent
        env:
          DEVOPS_AGENT_WEBHOOK_URL: ${{ secrets.DEVOPS_AGENT_WEBHOOK_URL }}
          DEVOPS_AGENT_WEBHOOK_SECRET: ${{ secrets.DEVOPS_AGENT_WEBHOOK_SECRET }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PR_NUM="${{ github.event.pull_request.number }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(cat <<EOF
          {
            "eventType": "incident",
            "incidentId": "gh-pr-${PR_NUM}-${{ github.run_id }}",
            "action": "created",
            "priority": "HIGH",
            "title": "Cloud Validation Failed on PR #${PR_NUM}: ${{ github.event.pull_request.title }}",
            "description": "PR #${PR_NUM} targeting main passed lint and unit tests, but failed during cloud infrastructure validation. Please inspect AWS telemetry, CloudWatch logs, CloudFormation/CDK events, and IAM permissions. Workflow: ${RUN_URL}. PR: ${PR_URL}",
            "timestamp": "${TIMESTAMP}",
            "service": "${{ github.event.repository.name }}",
            "data": {
              "metadata": {
                "repository": "${{ github.repository }}",
                "pr_number": "${PR_NUM}",
                "pr_url": "${PR_URL}",
                "commit": "${{ github.event.pull_request.head.sha }}",
                "branch": "${{ github.head_ref }}",
                "target_branch": "${{ github.base_ref }}",
                "run_id": "${{ github.run_id }}"
              }
            }
          }
          EOF
          )

          echo "Dispatching failure triage to AWS DevOps Agent for PR #${PR_NUM}..."
          curl -s -X POST "$DEVOPS_AGENT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEVOPS_AGENT_WEBHOOK_SECRET" \
            -d "$PAYLOAD"
